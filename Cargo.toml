[package]
name = "rs-graphics"
version = "0.3.0"
edition = "2024"
description = "A Rust port of the core functionality of R's `graphics` package, aiming for visual fidelity with R's own output."
license = "GPL-3.0-or-later"
authors = ["University of Bristol"]
rust-version = "1.85"

[lib]
name = "rs_graphics"
path = "src/lib.rs"

[dependencies]
tiny-skia = "0.11"
ab_glyph = "0.2"
miniz_oxide = "0.8"
adler2 = "2"
crc32fast = "1"

[dev-dependencies]
# used only by integration tests that shell out to Rscript for ground truth,
# and are skipped automatically if `Rscript` is not on PATH.

[[example]]
name = "gallery"
path = "examples/gallery.rs"
